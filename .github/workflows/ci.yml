name: SchoolSAAS CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify fresh Alembic schema installation
        env:
          JWT_SECRET: migration-test-key-not-for-production
          DATABASE_URL: sqlite:////tmp/schoolcare-alembic-test.db
          SCHEMA_AUTO_CREATE: 'false'
        run: python -m alembic upgrade head
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("app/index.html").read_text()
          js=html.rsplit("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/schoolcare-ui.js").write_text(js)
          PY
          node --check /tmp/schoolcare-ui.js
      - name: Run tests
        env:
          JWT_SECRET: ci-only-test-key-do-not-use-in-production
          PYTHONPATH: .
        run: python -m pytest -q

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run real browser workflow
        env:
          JWT_SECRET: browser-test-secret-not-for-production
          DATABASE_URL: sqlite:////tmp/schoolcare-browser-test.db
          SCHEMA_AUTO_CREATE: 'true'
          SCHOOLCARE_URL: http://127.0.0.1:8000
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/schoolcare-browser.log 2>&1 &
          python - <<'PY'
          import urllib.request, time
          for attempt in range(40):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000",timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("Test web server failed to start")
          PY
          python tests/browser_smoke.py
          python tests/browser_roles.py

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolcare
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: schoolcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolcare -d schoolcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://schoolcare:ci-only-password@localhost:5432/schoolcare
      JWT_SECRET: postgres-ci-test-secret-not-for-production
      SCHEMA_AUTO_CREATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Migrate new PostgreSQL schema
        run: python -m alembic upgrade head
      - name: Prepare RLS and non-superuser application role
        run: python scripts/prepare_postgres_rls_ci.py
      - name: Validate row-level tenant security
        env:
          DATABASE_URL: postgresql+psycopg://schoolcare_ci_app:ci-app-only-password@localhost:5432/schoolcare
        run: python -m pytest -q tests/test_postgres_rls.py

  cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Verify workflow in alternate browser engine
        env:
          JWT_SECRET: cross-browser-testing-only-secret
          DATABASE_URL: sqlite:////tmp/schoolcare-cross-browser.db
          SCHEMA_AUTO_CREATE: 'true'
          SCHOOLCARE_URL: http://127.0.0.1:8000
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/schoolcare-browser.log 2>&1 &
          python - <<'PY'
          import urllib.request, time
          for _ in range(45):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000',timeout=1)
                  break
              except Exception:time.sleep(1)
          else:raise RuntimeError('Test server failed to start')
          PY
          python tests/browser_smoke.py
