name: SchoolSAAS CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("app/index.html").read_text()
          js=html.rsplit("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/schoolcare-ui.js").write_text(js)
          PY
          node --check /tmp/schoolcare-ui.js
      - name: Run tests
        env:
          JWT_SECRET: ci-only-test-key-do-not-use-in-production
          PYTHONPATH: .
        run: python -m pytest -q
