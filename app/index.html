<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolCare | School workspace</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#172540;background:#f4f7fc;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f1b950;outline-offset:2px}
header{position:sticky;top:0;z-index:3;background:#122849;color:white;display:flex;justify-content:space-between;align-items:center;padding:13px 24px;gap:16px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.6px}.brand span{color:#8fb8ff}#account{display:flex;align-items:center;gap:12px}
#account small{color:#c3d2ed}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 62px)}
aside{background:white;border-right:1px solid #dfe5ef;padding:18px 11px}nav{position:sticky;top:84px}
.nav-group{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#7d899b;font-weight:800;margin:19px 12px 8px}
.nav-btn{display:block;width:100%;text-align:left;background:transparent;border:0;padding:11px 13px;color:#334363;border-radius:9px;margin:2px 0}
.nav-btn:hover{background:#f2f6ff}.nav-btn.active{background:#e8f0ff;color:#174cb3;font-weight:750}
main{padding:28px;max-width:1420px;width:100%;margin:0 auto;min-width:0}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 13px}h3{font-size:15px;margin:0 0 9px}p{line-height:1.6}.subtle{color:#66758d}.subheading{margin:6px 0 22px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:0;background:#2460d5;color:white;border-radius:9px;padding:10px 14px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:hover,.btn:hover{filter:brightness(.94)}button.secondary,.btn.secondary{background:#edf2fc;color:#164686}button.danger{background:#fff1f1;color:#a32e31}button.plain{background:transparent;color:#31548c}
button:disabled{opacity:.5;cursor:not-allowed}.panel{background:#fff;border:1px solid #e2e8f2;border-radius:14px;padding:21px;box-shadow:0 2px 10px #1a3c6508;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.metric{border:1px solid #e1e9f5;background:#fff;border-radius:12px;padding:20px}.metric strong{font-size:30px;display:block;margin-top:6px}.metric small{color:#64758e}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stack{display:grid;gap:12px}
label{font-weight:650;display:block;margin-bottom:6px;color:#3a4960}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c7d3e4;border-radius:8px;background:white;min-height:42px}
textarea{min-height:100px;resize:vertical}form{display:grid;gap:13px}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:5px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #e8edf5;white-space:normal}th{font-size:12px;color:#677892;background:#f8faff}tbody tr:hover{background:#f9fbff}
.linkbtn{padding:0;background:none;color:#1d56b3;text-decoration:underline;font-weight:650}.pill{border-radius:99px;background:#e9f1ff;color:#204f9b;padding:5px 9px;display:inline-block;font-size:12px}
.empty{padding:28px;text-align:center;color:#74819a;border:1px dashed #dce4ef;border-radius:10px}
#toast{display:none;position:fixed;right:22px;bottom:22px;z-index:15;background:#153c6b;color:white;border-radius:10px;padding:15px 18px;max-width:min(420px,90vw);box-shadow:0 10px 35px #0b2d4f30}
#dialog{display:none;position:fixed;inset:0;background:#14234199;z-index:10;align-items:center;justify-content:center;padding:18px}
#dialog.open{display:flex}#dialog .modal{background:white;border-radius:15px;padding:25px;width:min(640px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 15px 60px #0a214866}
#login-screen{min-height:calc(100vh - 65px);display:grid;place-items:center;padding:26px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:min(890px,100%)}
#menu-toggle{display:none}#login-screen .panel{margin:0}.result{font-size:12px;color:#66758d}.crumbs{margin-bottom:14px;color:#657792}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search-row input{max-width:320px}
#app-shell[hidden],#login-screen[hidden]{display:none}
@media(max-width:850px){#menu-toggle{display:inline-flex}.shell{grid-template-columns:1fr}aside{display:none;position:fixed;inset:62px auto 0 0;width:min(300px,85vw);z-index:5;box-shadow:20px 0 30px #1a274135;overflow-y:auto}aside.open{display:block}main{padding:18px}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:610px){.auth-grid,.grid2,.cards{grid-template-columns:1fr}header{padding:12px}#account small{display:none}main{padding:13px}.panel{padding:15px}h1{font-size:21px}.table-wrap{margin:0 -6px}th,td{padding:10px 7px}}
@media(max-width:610px){header{height:66px;min-height:66px;gap:6px}#global-search{display:none}#account small{display:none}aside{top:66px!important}.brand{font-size:18px}#account button{padding:8px}}
</style></head><body>
<header><div class="actions"><button id="menu-toggle" class="secondary" aria-label="Toggle navigation">☰</button><div class="brand">School<span>Care</span> <small style="font-size:11px;font-weight:500;color:#b4c7e5">/ SaaS</small></div></div><div class="actions"><input id="global-search" type="search" aria-label="Search learners from anywhere" placeholder="Find learner..." style="max-width:210px;min-height:35px" hidden><div id="account"></div></div></header>
<section id="login-screen"><div class="auth-grid">
<div class="panel"><h2>Sign in</h2><p class="subtle">Open your school's secure workspace.</p><p class="subtle" style="background:#eef5ff;border-radius:10px;padding:12px;margin:0 0 14px">Local demo login tip<br>School identifier: <strong>demo</strong><br>Email: <strong>admin@demo.local</strong><br>Use the password configured in your local environment.</p><form id="login"><div><label for="school-slug">School identifier</label><input id="school-slug" name="school_slug" required placeholder="demo"></div><div><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required placeholder="admin@demo.local"></div><div><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div><button>Sign in</button></form><p><button type="button" class="secondary" data-action="accept-invitation">Accept a staff invitation</button></p><p><button type="button" class="secondary" data-action="request-reset">Forgot password?</button></p></div>
<div class="panel"><h2>Register a school</h2><p class="subtle">Create an isolated demonstration workspace. Use fictional learner records only.</p><form id="register"><div><label for="school-name">School name</label><input id="school-name" name="school_name" required></div><div><label for="new-slug">School identifier</label><input id="new-slug" name="slug" required minlength="3" maxlength="40" title="3–40 lowercase letters, numbers, or hyphens" placeholder="example-school" autocomplete="off"></div><div><label for="reg-email">Administrator email</label><input id="reg-email" name="email" type="email" required></div><div><label for="reg-password">Password (12+ characters)</label><input id="reg-password" name="password" type="password" minlength="12" required></div><button>Create workspace</button></form></div>
</div></section>
<div id="app-shell" class="shell" hidden><aside id="sidebar"><nav id="nav" aria-label="Main navigation"></nav></aside><main id="main" tabindex="-1"><div id="page"></div></main></div>
<div id="toast" role="status" aria-live="polite"></div><div id="dialog" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="toolbar"><h2 id="modal-title">Details</h2><button class="secondary" id="close-dialog" aria-label="Close dialog">Close</button></div><div id="modal-body"></div></section></div>
<script>
(function(){
"use strict";
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const csrf=()=>decodeURIComponent(document.cookie.split("; ").find(x=>x.startsWith("csrf_token="))?.split("=")[1]||"");
let user=null, unsaved=false, records={};
const groups=[
 ["WORKSPACE",[["dashboard","Overview"],["notifications","Notifications"],["tasks","Review tasks"]]],
 ["LEARNERS",[["learners","Learners"],["classes","Grades & classes"],["class-assignments","Class assignments"]]],
 ["BEHAVIOUR",[["incidents","Incidents"],["cases","Cases"],["interventions","Interventions"],["appeals","Appeals"],["hearings","Hearings"],["evidence","Evidence"]]],
 ["COMMUNICATION",[["contacts","Parent contacts"],["guardians","Guardians"],["appointments","Meetings"],["documents","Document drafts"],["letters","Letter templates"],["parent-acks","Parent acknowledgements"]]],
 ["ANALYTICS",[["reports","Reports"]]],
 ["ADMINISTRATION",[["offences","Offences"],["conduct","Code of Conduct"],["staff","Staff & access"],["settings","Settings"],["security","Security & MFA"],["privacy","Privacy & retention"],["subscription","Subscription"],["billing","Billing"],["platform","Platform"],["audit","Audit log"]]]
];
const manager=()=>user&&["school_admin","principal","smt","hod"].includes(user.role);
const admin=()=>user&&["school_admin","principal"].includes(user.role);
const allowed=key=>!["tasks","cases","interventions","appeals","contacts","appointments","documents","reports","classes","guardians","class-assignments","hearings","evidence","letters","parent-acks","conduct"].includes(key)||manager();
const can=key=>allowed(key)&&(!["staff","settings","subscription","audit","security","privacy","billing","platform"].includes(key)||admin())&&(key!=="platform"||user.platform_admin);
const input=(name,label,type="text",value="",extra="")=>'<div><label for="field-'+esc(name)+'">'+esc(label)+'</label><input id="field-'+esc(name)+'" name="'+esc(name)+'" type="'+esc(type)+'" value="'+esc(value)+'" '+extra+'></div>';
const area=(name,label,value="")=>'<div><label for="field-'+esc(name)+'">'+esc(label)+'</label><textarea id="field-'+esc(name)+'" name="'+esc(name)+'">'+esc(value)+'</textarea></div>';
const options=(name,label,items,current="")=>'<div><label for="field-'+esc(name)+'">'+esc(label)+'</label><select id="field-'+esc(name)+'" name="'+esc(name)+'">'+items.map(x=>'<option value="'+esc(x[0])+'" '+(String(x[0])===String(current)?"selected":"")+'>'+esc(x[1])+'</option>').join("")+'</select></div>';
const choices=(arr,key="id",label="name")=>arr.map(x=>[x[key],x[label]]);
const btn=(name,action,id="",secondary=true)=>'<button type="button" class="'+(secondary?"secondary":"")+'" data-action="'+esc(action)+'" data-id="'+esc(id)+'">'+esc(name)+'</button>';
const head=(title,desc,buttons="")=>'<div class="toolbar"><div><h1>'+esc(title)+'</h1><p class="subheading subtle">'+esc(desc)+'</p></div><div class="actions">'+buttons+'</div></div>';
const panel=(body,title="")=>'<div class="panel">'+(title?'<h2>'+esc(title)+'</h2>':"")+body+'</div>';
const table=(cols,rows)=>rows.length?'<div class="table-wrap"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(cell=>'<td>'+cell+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>':'<div class="empty">No records found. Add a record or change the search.</div>';
const bars=obj=>{const entries=Object.entries(obj);if(!entries.length)return '<div class="empty">No data yet</div>';const max=Math.max(1,...entries.map(x=>Number(x[1])));return '<div class="stack">'+entries.map(x=>'<div><div class="toolbar" style="margin-bottom:4px"><span>'+esc(x[0])+'</span><strong>'+esc(x[1])+'</strong></div><div style="height:10px;border-radius:20px;background:#edf2fc;overflow:hidden"><div style="background:#3b72dc;height:100%;width:'+Math.round(Number(x[1])/max*100)+'%"></div></div></div>').join("")+'</div>'};
const plain=x=>esc(x), pill=x=>'<span class="pill">'+esc(x)+'</span>';
const link=(text,page,id)=>'<button class="linkbtn" type="button" data-go="'+esc(page)+(id?"/"+esc(id):"")+'">'+esc(text)+'</button>';
const jsonForm=(id,body,label="Save")=>'<form data-form="'+esc(id)+'">'+body+'<div class="form-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit">'+esc(label)+'</button></div></form>';
const toast=(msg,bad=false)=>{const e=$("toast");e.style.display="block";e.style.background=bad?"#9b2736":"#153c6b";e.textContent=msg;setTimeout(()=>e.style.display="none",6500)};
const getData=form=>Object.fromEntries(new FormData(form).entries());
async function api(path,method="GET",data){
 const response=await fetch("/api/"+path,{method,credentials:"same-origin",
   headers:{"Content-Type":"application/json",...(csrf()?{"X-CSRF-Token":csrf()}:{})},
   body:data===undefined?undefined:JSON.stringify(data)});
 const text=await response.text();let result;
 try{result=text?JSON.parse(text):{}}catch{result={detail:text||"Unexpected response"}}
 if(!response.ok)throw new Error(typeof result.detail==="string"?result.detail:"Request failed ("+response.status+")");
 return result;
}
function modal(title,body){unsaved=false;$("modal-title").textContent=title;$("modal-body").innerHTML=body;$("dialog").classList.add("open");$("dialog").querySelector("input,select,textarea,button")?.focus()}
function close(){if(unsaved&&!confirm("Discard unsaved changes?"))return;$("dialog").classList.remove("open");$("modal-body").innerHTML="";unsaved=false}
function path(){return decodeURIComponent(location.hash.replace(/^#\/?/,""))||"dashboard"}
function navigate(value){if(unsaved&&!confirm("Discard unsaved form changes?"))return;unsaved=false;location.hash="#/"+value;render()}
function navigation(){
 $("nav").innerHTML=groups.map(g=>{const items=g[1].filter(x=>can(x[0]));return items.length?'<div class="nav-group">'+esc(g[0])+'</div>'+items.map(x=>'<button class="nav-btn" data-go="'+esc(x[0])+'">'+esc(x[1])+'</button>').join(""):""}).join("");
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",path().split("/")[0]===b.dataset.go));
 $("sidebar").classList.remove("open");
}
function selectRows(data,keys){return data.map(x=>keys.map(k=>plain(x[k])))}
function filterTable(data,search,fields){const term=search.toLowerCase().trim();return data.filter(x=>fields.some(f=>String(x[f]??"").toLowerCase().includes(term)))}
function searchBox(placeholder="Search records") {return '<div class="search-row"><input id="list-search" type="search" aria-label="'+esc(placeholder)+'" placeholder="'+esc(placeholder)+'"><span class="result" id="result-count"></span></div>'}
function bindSearch(data,fields,draw){const inp=$("list-search");if(!inp)return;const update=()=>{let rows=filterTable(data,inp.value,fields);$("result-count").textContent=rows.length+" of "+data.length+" records";$("list-table").innerHTML=draw(rows.slice(0,100));};inp.addEventListener("input",update);update()}
const schoolLearners=async()=>api("learners");
const learnerPicker=async()=>{const d=await api("directory/learners?limit=50");return '<div><label for="learner-search-field">Search learner by name or admission number</label><input id="learner-search-field" type="search" placeholder="Start typing a learner name" autocomplete="off"></div>'+options("learner_id","Select learner",d.items.map(x=>[x.id,x.name+" · "+x.class_name]));};
function bindLearnerPicker(){const input=$("modal-body").querySelector("#learner-search-field"),select=$("modal-body").querySelector('[name="learner_id"]');if(!input||!select)return;let counter=0;input.addEventListener("input",async()=>{const seq=++counter;const q=input.value;try{const d=await api("directory/learners?limit=50&q="+encodeURIComponent(q));if(seq!==counter)return;select.innerHTML=d.items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name+" · "+x.class_name)+'</option>').join("");select.disabled=d.items.length===0;select.dispatchEvent(new Event("change"))}catch(e){toast(e.message,true)}})}

let directoryState={q:"",offset:0,total:0};
const schoolOffences=async()=>api("offences");
async function dashboard(){
 if(user.role==="educator"){const inc=await api("incidents");$("page").innerHTML=head("Educator workspace","Record behaviour concerns and review your own reports",btn("Report incident","create-incident","",false))+ '<div class="cards"><div class="metric"><small>My reported incidents</small><strong>'+inc.length+'</strong></div><div class="metric"><small>My assigned class</small><strong>'+esc(user.assigned_class||"Not assigned")+'</strong></div></div>'+panel(table(["Incident","Status","Date"],inc.slice(0,12).map(x=>[link("#"+x.id,"incidents",x.id),pill(x.status),plain(x.created_at.slice(0,10))])),"Recent reports");return}
 const [d,n,stats]=await Promise.all([api("dashboard/aggregates"),api("notifications"),api("analytics/overview")]);
 $("page").innerHTML=head(d.school+" overview","Your school's learner support and discipline summary",btn("Report incident","create-incident","",false))+
 '<div class="cards"><div class="metric"><small>Learners</small><strong>'+d.learners+'</strong></div><div class="metric"><small>Incidents</small><strong>'+d.incidents+'</strong></div><div class="metric"><small>Open cases</small><strong>'+d.open_cases+'</strong></div></div>'+
 '<div class="grid2">'+panel(table(["Location","Incidents"],Object.entries(d.locations).map(x=>[plain(x[0]),plain(x[1])])),"Incident locations")+
 panel(table(["Review","Due"],n.slice(0,8).map(x=>[link(x.title+" (#"+x.incident_id+")","incidents",x.incident_id),plain(x.due_at.slice(0,10))])),"Action required")+'</div>'+
 '<div class="cards"><div class="metric"><small>Repeat-behaviour rate</small><strong>'+stats.repeat_rate+'%</strong></div><div class="metric"><small>Interventions recorded</small><strong>'+stats.interventions+'</strong></div><div class="metric"><small>Pending reviews</small><strong>'+stats.pending_reviews+'</strong></div></div>'+
 '<div class="grid2">'+panel(bars(stats.months),"Monthly trend")+panel(bars(stats.severity),"Severity levels")+'</div>';
}
async function learnerDirectory(){
 const state=directoryState;
 const response=await api("directory/learners?limit=50&offset="+state.offset+"&q="+encodeURIComponent(state.q));
 state.total=response.total;
 $("page").innerHTML=head("Learners","Search and manage learner records across all grades",user.role==="educator"?"":btn("Add learner","create-learner","",false)+(admin()?btn("Import CSV","import-learners"):""))+
 panel('<div class="search-row"><input id="directory-query" type="search" placeholder="Name, admission number or class" aria-label="Search learners" value="'+esc(state.q)+'"><span class="result">'+esc(state.total)+' learner records</span></div><div id="learner-records">'+
 table(["Learner","Admission","Grade","Class"],response.items.map(x=>[link(x.name,"learners",x.id),plain(x.admission_no),plain(x.grade),plain(x.class_name)]))+'</div>'+
 '<div class="toolbar" style="margin-top:14px"><span class="subtle">Showing '+(response.total?state.offset+1:0)+'–'+Math.min(state.offset+50,state.total)+' of '+state.total+'</span><div class="actions">'+
 '<button type="button" class="secondary" id="prev-page" '+(state.offset===0?"disabled":"")+'>Previous</button>'+
 '<button type="button" class="secondary" id="next-page" '+(state.offset+50>=state.total?"disabled":"")+'>Next</button></div></div>');
 let searchTimer;
 $("directory-query").addEventListener("input",e=>{clearTimeout(searchTimer);const val=e.target.value;searchTimer=setTimeout(()=>{state.q=val;state.offset=0;learnerDirectory()},300)});
 $("prev-page").onclick=()=>{state.offset=Math.max(0,state.offset-50);learnerDirectory()};
 $("next-page").onclick=()=>{state.offset+=50;learnerDirectory()};
}

let paging={incidents:0,cases:0};
async function paginatedRegister(key){
 const offset=paging[key], result=await api("directory/"+key+"?limit=50&offset="+offset);
 const rows=result.items.map(x=>key==="incidents"?
 [link("#"+x.id,"incidents",x.id),link("#"+x.learner_id,"learners",x.learner_id),pill(x.status),plain(x.created_at.slice(0,10))]:
 [link("#"+x.id,"cases",x.id),link("#"+x.learner_id,"learners",x.learner_id),plain(x.title),pill(x.status)]);
 $("page").innerHTML=head(key==="cases"?"Cases":"Incidents","School records with server-side pagination",btn(key==="cases"?"New case":"Report incident",key==="cases"?"create-case":"create-incident","",false))+
 panel(table(key==="cases"?["Case","Learner","Title","Status"]:["Incident","Learner","Status","Created"],rows)+
 '<div class="toolbar" style="margin-top:16px"><span>'+esc(result.total)+' total • '+esc(offset+1)+'–'+esc(Math.min(offset+50,result.total))+'</span><div class="actions">'+
 '<button class="secondary" id="page-previous" '+(offset===0?"disabled":"")+'>Previous</button>'+
 '<button class="secondary" id="page-next" '+(offset+50>=result.total?"disabled":"")+'>Next</button></div></div>');
 $("page-previous").onclick=()=>{paging[key]=Math.max(0,offset-50);paginatedRegister(key)};
 $("page-next").onclick=()=>{paging[key]=offset+50;paginatedRegister(key)};
}
async function classAssignmentsPage(){
 const [rows,staff]=await Promise.all([api("class-assignments"),api("case-assignees")]);
 $("page").innerHTML=head("Class assignments","School-scoped staff assignments",admin()?btn("Assign staff to class","assign-class","",false):"")+
 panel(table(["Staff","Class","Action"],rows.map(x=>[
 plain(staff.find(y=>y.user_id===x.user_id)?.label||"Staff #"+x.user_id),plain(x.class_name),
 admin()?btn("Remove","remove-class",x.id):"—"])));
}
async function guardianPage(){
 $("page").innerHTML=head("Guardians","View guardian contacts through individual learner profiles")+
 panel('<p>Guardian details are restricted to authorised school management staff. Open a learner profile to view or add guardians.</p>'+
 btn("Open learners","go-learners"));
}

async function listPage(key){
 const config={
 learners:["Learners","Manage learner records and access learner history","learners",["name","admission_no","grade","class_name"],["Learner","Admission","Grade","Class"]],
 incidents:["Incidents","Review, classify and follow up reported events","incidents",["description","location","status","id"],["Incident","Location","Status","Reported"]],
 cases:["Cases","Manage formal cases and linked learner incidents","cases",["title","status","id"],["Case","Title","Status","Learner"]],
 offences:["Offence catalogue","School-specific behaviour classifications","offences",["name","code","category"],["Code","Offence","Category","Level"]],
 staff:["Staff & access","Invite staff and manage roles and class assignments","members",["email","role","assigned_class"],["Email","Role","Class","Status"]],
 interventions:["Interventions","Track actions and outcomes, not just incidents","interventions",["type","outcome","notes"],["ID","Incident","Type","Outcome"]],
 contacts:["Parent communications","Document communications with guardians","parent-contacts",["purpose","method","outcome"],["Learner","Method","Purpose","Outcome"]],
 tasks:["Review tasks","Action urgent and repeated behaviour referrals","review-tasks",["reason","status"],["Incident","Reason","Due","Status"]],
 appeals:["Appeals & reviews","Track challenges, review and outcomes","appeals",["reason","status"],["Case","Reason","Status"]],
 appointments:["Meetings","Schedule and record guardian meetings","appointments",["title","status"],["Learner","Meeting","Date","Status"]],
 documents:["Document drafts","Store school-approved correspondence drafts","documents",["title","document_type"],["Learner","Title","Type","Date"]],
 classes:["Grades & classes","Current class allocation derived from learner records","classes",["grade","class_name"],["Grade","Class","Learners"]],
 audit:["Audit log","School-scoped administrative activity","audit",["action","subject"],["Action","Record","Time"]]
 };

 case "edit-hearing":name="Update hearing";kind="hearing-update:"+id;body=options("status","Status",["scheduled","in_progress","adjourned","completed","cancelled"].map(x=>[x,x]))+input("outcome","Outcome","text")+area("notes","Notes");break;
 case "upload-evidence":name="Upload evidence";kind="upload-evidence";body=input("incident_id","Incident ID (optional)","number")+input("case_id","Case ID (optional)","number")+'<div><label for="evidence-file">File</label><input id="evidence-file" name="file" type="file" required></div>';break;
 case "create-letter":name="New letter template";kind="letter-templates";body=input("code","Code","text","","required")+input("name","Name","text","","required")+area("body","Body (use {{learner_name}}, {{grade}}, {{class_name}}, {{school}}, {{date}})");break;
 case "render-letter":name="Render letter draft";kind="render-letter:"+id;body=input("learner_id","Learner ID","number","","required");break;
 case "invite-parent":name="Invite parent acknowledgement";kind="parent-portal/invite";body=input("learner_id","Learner ID","number","","required")+input("email","Guardian email","email","","required")+input("subject","Subject","text","SchoolCare notice","required");break;
 case "mfa-setup":data=await api("mfa/setup","POST",{});modal("MFA setup",panel('<p class="subtle">Add this secret to your authenticator app, then enable MFA.</p><p><code>'+esc(data.secret)+'</code></p><p class="subtle">'+esc(data.otpauth_uri)+'</p>'));return;
 case "mfa-enable":name="Enable MFA";kind="mfa/enable";body=input("code","Authenticator code","text","","required minlength=\"6\"");break;
 case "mfa-disable":name="Disable MFA";kind="mfa/disable";body=input("code","Authenticator code","text","","required minlength=\"6\"");break;
 case "set-retention":name="Retention rule";kind="privacy/retention";body=input("record_type","Record type","text","incidents","required")+input("retain_days","Retain days","number","2555","required min=\"30\"")+input("notes","Notes","text");break;
 case "create-invoice":name="Issue invoice";kind="billing/invoices";body=input("amount_cents","Amount in cents","number","50000","required min=\"100\"")+input("description","Description","text","SchoolCare subscription");break;
 case "mark-paid":await api("billing/invoices/"+id+"/mark-paid","POST",{});toast("Invoice marked paid (manual)");navigate("billing");return;
 case "suspend-school":await api("platform/schools","PATCH",{school_id:Number(id),status:"suspended"});toast("School suspended");navigate("platform");return;
 case "activate-school":await api("platform/schools","PATCH",{school_id:Number(id),status:"active"});toast("School activated");navigate("platform");return;
 case "complete-mfa":name="Enter MFA code";kind="mfa/verify-login";body=input("mfa_token","MFA token","text",id,'readonly required')+input("code","Authenticator code","text","","required minlength=\"6\"");break;
 case "parent-ack":name="Acknowledge school notice";kind="parent-portal/acknowledge";body=input("token","Access token","text",id,'readonly required')+input("subject","Subject acknowledged","text","SchoolCare notice","required");break;
 default:return;
 }
 modal(name,jsonForm(kind,body,name.startsWith("Edit")?"Save changes":"Save"));bindLearnerPicker();
 if(action==="create-case"){const update=()=>{const learner=$("modal-body").querySelector("[name=learner_id]").value;$("modal-body").querySelectorAll("[name=linked_incident]").forEach(ch=>{ch.parentElement.hidden=ch.dataset.learner!==learner;if(ch.dataset.learner!==learner)ch.checked=false})};$("modal-body").querySelector("[name=learner_id]").addEventListener("change",update);update()}
}
async function submitForm(f){
 let k=f.dataset.form,data=getData(f),url=k,method="POST",go=path().split("/")[0];
 const split=k.split(":");const id=split[1];const prefix=split[0];
 const intFields=["learner_id","offence_id","incident_id","severity","case_id","repeat_threshold","assigned_user_id"];
 for(const field of [...intFields,"owner_user_id","user_id"])if(data[field]!==undefined&&data[field]!=="")data[field]=Number(data[field]);
 if(data.active!==undefined)data.active=data.active==="true";
 if(prefix==="learner-update"){url="learners/"+id;method="PATCH";go="learners/"+id}
 if(prefix==="incident-review"){url="incidents/"+id+"/review";method="PATCH";go="incidents/"+id}
 if(prefix==="case-status"){url="cases/"+id;method="PATCH";go="cases/"+id}
 if(prefix==="case-assignment"){url="cases/"+id+"/assign";method="PATCH";data.assigned_user_id=data.assigned_user_id||null;go="cases/"+id}
 if(prefix==="member-update"){url="members/"+id;method="PATCH";go="staff"}
 if(prefix==="case-timeline"){url="cases/"+id+"/timeline";go="cases/"+id}
 if(prefix==="case-followup"){url="cases/"+id+"/follow-ups";data.due_at=new Date(data.due_at).toISOString();go="cases/"+id}
 if(prefix==="followup-update"){url="follow-ups/"+id;method="PATCH";go="cases"}
 if(k==="guardians")go="learners/"+data.learner_id;
 if(k==="class-assignments")go="class-assignments";
 if(prefix==="offence-update"){url="offences/"+id;method="PATCH";data.severity=Number(data.severity);go="offences"}
 if(prefix==="intervention-update"){url="interventions/"+id;method="PATCH";go="interventions"}
 if(prefix==="task-update"){url="review-tasks/"+id;method="PATCH";go="tasks"}
 if(prefix==="appeal-update"){url="appeals/"+id;method="PATCH";go="appeals"}
 if(prefix==="appointment-update"){url="appointments/"+id;method="PATCH";go="appointments"}
 if(k==="settings"){url="settings";method="PUT";go="settings"}
 if(k==="academic"){url="settings/academic";method="PUT";data.academic_year=Number(data.academic_year);data.term=Number(data.term);go="settings"}
 if(k==="conduct-versions"){data.effective_from=new Date(data.effective_from).toISOString();go="conduct"}
 if(k==="hearings"){data.scheduled_at=new Date(data.scheduled_at).toISOString();go="hearings"}
 if(prefix==="hearing-update"){url="hearings/"+id;method="PATCH";go="hearings"}
 if(k==="letter-templates")go="letters"
 if(prefix==="render-letter"){url="letter-templates/"+id+"/render?learner_id="+encodeURIComponent(data.learner_id);method="POST";const rendered=await api(url,method,{});modal(rendered.name,panel('<pre style="white-space:pre-wrap">'+esc(rendered.rendered_text)+'</pre><p class="subtle">Draft only — not emailed or posted.</p>'));close();return}
 if(k==="parent-portal/invite")go="parent-acks"
 if(k==="parent-portal/acknowledge"){go="";}
 if(k==="mfa/enable"||k==="mfa/disable")go="security"
 if(k==="privacy/retention"){url="privacy/retention";method="PUT";data.retain_days=Number(data.retain_days);go="privacy"}
 if(k==="billing/invoices"){data.amount_cents=Number(data.amount_cents);go="billing"}
 if(k==="mfa/verify-login"){await api(k,"POST",data);user=await api("me");if(!user.authenticated)throw Error("MFA session was not created");$("login-screen").hidden=true;$("app-shell").hidden=false;$("global-search").hidden=false;$("account").innerHTML='<small>'+esc(user.school)+" · "+esc(user.role)+'</small><button id="logout" class="secondary">Sign out</button>';close();navigate("dashboard");schoolSelector();toast("Signed in with MFA");return}
 if(k==="upload-evidence"){
   const file=f.querySelector('[name="file"]').files[0];if(!file){toast("Choose a file",true);return}
   const fd=new FormData();if(data.incident_id)fd.append("incident_id",data.incident_id);if(data.case_id)fd.append("case_id",data.case_id);fd.append("file",file);
   const response=await fetch("/api/evidence",{method:"POST",credentials:"same-origin",headers:{...(csrf()?{"X-CSRF-Token":csrf()}:{})},body:fd});
   const result=await response.json();if(!response.ok)throw Error(typeof result.detail==="string"?result.detail:"Upload failed");
   toast("Evidence uploaded");unsaved=false;close();navigate("evidence");return
 }
 if(k==="import-learners"){
   const file=f.querySelector('[name="file"]').files[0];if(!file){toast("Choose a CSV file",true);return}
   const text=await file.text();
   const parsed=[];let cells=[],value="",quoted=false;
   for(let i=0;i<text.length;i++){const ch=text[i];
    if(quoted){if(ch==='"'&&text[i+1]==='"'){value+='"';i++}else if(ch==='"')quoted=false;else value+=ch}
    else if(ch==='"')quoted=true;
    else if(ch===","){cells.push(value);value=""}
    else if(ch==="\n"){cells.push(value);if(cells.some(x=>x.trim()))parsed.push(cells);cells=[];value=""}
    else if(ch!=="\r")value+=ch;
   }
   cells.push(value);if(cells.some(x=>x.trim()))parsed.push(cells);
   const header=parsed.shift()?.map(x=>x.trim().toLowerCase());
   const expected=["admission_no","first_name","surname","grade","class_name"];
   if(!header||!expected.every(x=>header.includes(x))){toast("CSV must include admission_no, first_name, surname, grade and class_name",true);return}
   if(parsed.length>1000){toast("Maximum 1,000 learner rows per file",true);return}
   const rows=parsed.map(parts=>Object.fromEntries(expected.map(x=>[x,(parts[header.indexOf(x)]||"").trim()])));
   data={rows};url="learners/import";go="learners";
 }
 if(k==="cases"){data.incident_ids=Array.from(f.querySelectorAll("[name=linked_incident]:checked")).map(x=>Number(x.value));if(!data.incident_ids.length){toast("Select at least one incident",true);return}go="cases"}
 if(k==="parent-contacts")go="contacts";
 if(k==="invitations")go="staff";
 if(k==="invitations/accept")go="dashboard";
 if(k.startsWith("account-recovery/"))go="dashboard";
 if(k==="appointments"){data.scheduled_at=new Date(data.scheduled_at).toISOString();go="appointments"}
 if(k==="interventions")go="interventions";
 if(k==="documents")go="documents";
 if(k==="appeals")go="appeals";
 try{const result=await api(url,method,data);unsaved=false;close();
 if(k==="account-recovery/complete"){history.replaceState(null,"",location.pathname);toast("Password changed. Sign in again.");return}
 if(k==="account-recovery/request"){toast(result.message||"Check your email for recovery instructions.");return}
 if(k==="invitations/accept"){toast("Invitation accepted. Sign in with your school identifier.");return}
 if(k==="invitations"){if(result.emailed){toast(result.notice||"Invitation emailed");navigate("staff");return}modal("Invitation generated",panel('<p>'+esc(result.notice||"Share this token privately.")+'</p><textarea readonly aria-label="Invitation token">'+esc(result.token||"")+'</textarea>'));return}
 toast(k==="import-learners"?"Imported "+result.created+" learners; skipped "+result.skipped.length+" duplicates":"Saved successfully");unsaved=false;navigate(go);
 }catch(e){toast(e.message,true)}
}
async function schoolSelector(){
 try{const all=await api("mine/schools");if(all.length<=1)return;
 const current=all.find(x=>x.current);
 const control=document.createElement("select");
 control.setAttribute("aria-label","Switch school workspace");control.style.maxWidth="180px";
 control.innerHTML=all.map(x=>'<option value="'+esc(x.id)+'" '+(x.current?"selected":"")+'>'+esc(x.name)+'</option>').join("");
 control.onchange=async()=>{if(!confirm("Switch school workspace?")){control.value=String(current.id);return}
 try{await api("mine/schools/switch","POST",{school_id:Number(control.value)});location.hash="#/dashboard";location.reload()}catch(e){toast(e.message,true);control.value=String(current.id)}};
 $("account").prepend(control)
 }catch(e){toast(e.message,true)}
}
async function signIn(type,f){
 try{const data=getData(f);if(type==="login"){data.school_slug=(data.school_slug||"").trim().toLowerCase();data.email=(data.email||"").trim().toLowerCase()}if(type==="register"){data.slug=(data.slug||"").trim().toLowerCase();data.school_name=(data.school_name||"").trim();if(!/^[a-z0-9-]{3,40}$/.test(data.slug))throw Error("School identifier must be 3–40 lowercase letters, numbers, or hyphens");if((data.password||"").length<12)throw Error("Password must be at least 12 characters")}
  const auth=await api(type,"POST",data);
  if(auth&&auth.mfa_required){await openAction("complete-mfa",auth.mfa_token);return}
  user=await api("me");if(!user.authenticated)throw Error("Signed in but session was not created");$("login-screen").hidden=true;$("app-shell").hidden=false;$("global-search").hidden=false;$("account").innerHTML='<small>'+esc(user.school)+" · "+esc(user.role)+'</small><button id="logout" class="secondary">Sign out</button>';navigate("dashboard");schoolSelector()}
 catch(e){toast(e.message,true)}
}
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;if(f.id==="login"||f.id==="register")signIn(f.id,f);else if(f.dataset.form)submitForm(f)});
document.addEventListener("click",async e=>{
 const link=e.target.closest("[data-go]");if(link){navigate(link.dataset.go);return}
 const a=e.target.closest("[data-action]");if(a){
  const x=a.dataset.action;
  if(x==="close"){close();return}if(x==="reload"){render();return}
  if(x==="go-learners"){navigate("learners");return}
  if(x==="remove-class"){if(!confirm("Remove class assignment?"))return;try{await api("class-assignments/"+a.dataset.id,"DELETE");toast("Removed");render()}catch(err){toast(err.message,true)}return}
  try{await openAction(x,a.dataset.id)}catch(err){toast(err.message,true)}
 }
 if(e.target.id==="logout"){try{await api("logout","POST");location.reload()}catch(err){toast(err.message,true)}}
 if(e.target.id==="close-dialog")close();
 if(e.target.id==="menu-toggle")$("sidebar").classList.toggle("open");
});
document.addEventListener("input",e=>{if(e.target.closest("#dialog form")||e.target.closest('[data-form="settings"]')||e.target.closest('[data-form="academic"]'))unsaved=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("dialog").classList.contains("open"))close();if(e.key==="Enter"&&e.target.id==="global-search"){e.preventDefault();directoryState.q=e.target.value;directoryState.offset=0;navigate("learners")}});
window.addEventListener("beforeunload",e=>{if(unsaved){e.preventDefault();e.returnValue=""}});
window.addEventListener("hashchange",()=>render());
(async()=>{if(location.hash.startsWith("#reset=")){const token=location.hash.slice(7);try{await openAction("complete-reset",token)}catch(e){toast(e.message,true)}return}if(location.hash.startsWith("#parent=")){const token=location.hash.slice(8);try{await openAction("parent-ack",token)}catch(e){toast(e.message,true)}return}try{user=await api("me");if(!user.authenticated)return;$("login-screen").hidden=true;$("app-shell").hidden=false;$("global-search").hidden=false;$("account").innerHTML='<small>'+esc(user.school)+" · "+esc(user.role)+'</small><button id="logout" class="secondary">Sign out</button>';render();schoolSelector()}catch{}})();
})();
</script></body></html>
